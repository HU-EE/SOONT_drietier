name: STM32CubeIDE Build Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build STM32CubeIDE project
        uses: xanderhendriks/action-build-stm32cubeide@v17.0
        with:
          project-path: '.'
          project-target: 'STM32_vga_controller/Debug'
